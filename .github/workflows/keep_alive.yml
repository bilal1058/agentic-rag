name: Keep Streamlit Alive & Auto-Wake

on:
  schedule:
    # Attempt ping frequently (note: GitHub Actions cron may be queued/delayed by runner loads)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Ping Streamlit & Auto-Wake if Asleep
        run: node scripts/keep_alive.js
