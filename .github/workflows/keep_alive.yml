name: Keep Streamlit Alive & Active Session

on:
  schedule:
    # Run every 2 hours at minute 20 (avoids top-of-the-hour GitHub queue congestion)
    - cron: '20 */2 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Establish Real Viewer Session & Auto-Wake
        run: node scripts/keep_alive.js
