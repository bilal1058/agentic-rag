<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OAuth Bridge</title>
</head>
<body style="margin:0; padding:0; overflow:hidden; background:transparent;">
  <script>
  (function() {
    function sendMessage(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data || {}), "*");
    }

    // 1. Notify Streamlit that component is ready
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    // 2. Set height to 0
    sendMessage("streamlit:setFrameHeight", { height: 0 });

    function setStreamlitValue(val) {
      sendMessage("streamlit:setComponentValue", { value: val });
    }

    function applyInstantOverlay() {
      try {
        if (window.parent && window.parent.document && window.parent.document.body) {
          window.parent.document.body.classList.add("oauth-authenticating");
          if (!window.parent.document.getElementById("oauth-instant-overlay")) {
            var overlay = window.parent.document.createElement("div");
            overlay.id = "oauth-instant-overlay";
            overlay.style.cssText = "position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0e1117;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;";
            overlay.innerHTML = '<div style="width:52px;height:52px;border:3.5px solid rgba(249,115,22,0.2);border-top:3.5px solid #ff7a00;border-radius:50%;animation:authSpin 0.75s linear infinite;margin-bottom:20px;"></div><h2 style="color:#f5f5f5;font-size:22px;font-weight:700;margin:0 0 8px 0;letter-spacing:-0.4px;">Signing you in...</h2><p style="color:#a1a1aa;font-size:14px;margin:0;">Verifying your Google credentials and opening your workspace</p><style>@keyframes authSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>';
            window.parent.document.body.appendChild(overlay);
          }
        }
      } catch(e) {}
    }

    function checkAndSendToken(args) {
      // If logout requested, clear tokens and cookies
      if (args && args.logout) {
        try {
          var expCookie = "agentic_auth_token=; path=/; max-age=0; SameSite=Lax";
          document.cookie = expCookie;
          if (window.parent && window.parent.document) {
            window.parent.document.cookie = expCookie;
            window.parent.document.body.classList.remove("oauth-authenticating");
            var ov = window.parent.document.getElementById("oauth-instant-overlay");
            if (ov) ov.remove();
          }
          localStorage.removeItem("agentic_auth_token");
          sessionStorage.removeItem("agentic_auth_token");
        } catch(e) {}
        return;
      }

      var token = null;

      // Check 1: Parent window hash (#access_token=...)
      // NOTE: We deliberately DO NOT call history.replaceState so Streamlit Cloud does not reload
      try {
        var pHash = window.parent && window.parent.location ? window.parent.location.hash : "";
        if (pHash && pHash.includes("access_token=")) {
          applyInstantOverlay();
          var cleanHash = pHash.startsWith("#") ? pHash.substring(1) : pHash;
          var hashParams = new URLSearchParams(cleanHash);
          token = hashParams.get("access_token");
        }
      } catch(e) {
        console.warn("OAuth bridge parent hash check:", e);
      }

      // Check 2: Current window hash
      if (!token) {
        try {
          var iHash = window.location.hash || "";
          if (iHash && iHash.includes("access_token=")) {
            applyInstantOverlay();
            var cleanIHash = iHash.startsWith("#") ? iHash.substring(1) : iHash;
            var iParams = new URLSearchParams(cleanIHash);
            token = iParams.get("access_token");
          }
        } catch(e) {}
      }

      // Check 3: Check localStorage / sessionStorage
      if (!token) {
        try {
          token = localStorage.getItem("agentic_auth_token") || sessionStorage.getItem("agentic_auth_token");
          if (token) {
            applyInstantOverlay();
          }
        } catch(e) {}
      }

      if (token) {
        try {
          var cookieStr = "agentic_auth_token=" + encodeURIComponent(token) + "; path=/; max-age=2592000; SameSite=Lax";
          document.cookie = cookieStr;
          if (window.parent && window.parent.document) {
            window.parent.document.cookie = cookieStr;
          }
          localStorage.setItem("agentic_auth_token", token);
          sessionStorage.setItem("agentic_auth_token", token);
        } catch(e) {}
        // Send token to Python backend
        setStreamlitValue(token);
      }
    }

    // Immediate checks
    checkAndSendToken({});
    setTimeout(function() { checkAndSendToken({}); }, 0);
    setTimeout(function() { checkAndSendToken({}); }, 50);

    // Safety timeout: remove overlay after 6 seconds if token validation fails
    setTimeout(function() {
      try {
        if (window.parent && window.parent.document) {
          var ov = window.parent.document.getElementById("oauth-instant-overlay");
          if (ov) ov.remove();
        }
      } catch(e) {}
    }, 6000);

    // Listen for render messages from Streamlit
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "streamlit:render") {
        var args = event.data.args || {};
        checkAndSendToken(args);
      }
    });

    // Cross-tab storage updates
    window.addEventListener("storage", function(event) {
      if (event.key === "agentic_auth_token" && event.newValue) {
        applyInstantOverlay();
        setStreamlitValue(event.newValue);
      }
    });
  })();
  </script>
</body>
</html>
